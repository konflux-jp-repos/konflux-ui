name: PR Check E2E

# Phase 2 of two-phase PR E2E: trusted workflow from the default branch.
# Triggered after PR Check Gate completes; holds secrets and runs deploy/e2e.
# Requires this file on main (workflow_run only uses workflows on the default branch).
on:
  workflow_run:
    workflows: ['PR Check Gate']
    types: [completed]

concurrency:
  group: pr-check-e2e-${{ github.event.workflow_run.head_branch || github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  authorize:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'pull_request' ||
       github.event.workflow_run.event == 'merge_group')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pull-requests: write
      issues: write
    outputs:
      pr_number: ${{ steps.auth.outputs.pr_number }}
      actor: ${{ steps.auth.outputs.actor }}
      event_action: ${{ steps.auth.outputs.event_action }}
      head_repository: ${{ steps.auth.outputs.head_repository }}
      head_sha: ${{ steps.auth.outputs.head_sha }}
      head_branch: ${{ steps.auth.outputs.head_branch }}
    steps:
      - name: Download gate metadata
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pr-check-gate-metadata
          path: ${{ runner.temp }}/gate-metadata
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Resolve PR context and authorize
        id: auth
        env:
          GITHUB_TOKEN: ${{ secrets.HAC_TEST_GH_TOKEN }}
          GATE_METADATA_PATH: ${{ runner.temp }}/gate-metadata/metadata.json
          TRIGGER_EVENT: ${{ github.event.workflow_run.event }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Sticky approval comments are only trusted when authored by this token's account.
          APPROVAL_WRITER_ID=$(gh api user --jq '.id')
          APPROVAL_MARKER='<!-- ok-to-test-sha:'
          REQUIRED_LABEL_NAME="ok-to-test"

          has_write_access() {
            local login="$1"
            local role
            role=$(gh api "repos/${REPO}/collaborators/${login}/permission" --jq '.role_name' 2>/dev/null || true)
            case "$role" in
              admin|maintain|write) return 0 ;;
              *) return 1 ;;
            esac
          }

          # Only comments from APPROVAL_WRITER_ID; body text alone is never enough.
          trusted_approval_comment() {
            local pr_number="$1"
            gh api --paginate "repos/${REPO}/issues/${pr_number}/comments" \
              --jq "[.[] | select(.user.id == ${APPROVAL_WRITER_ID} and .body != null and (.body | contains(\"${APPROVAL_MARKER}\")))]" \
              | jq 'last // empty'
          }

          get_approval() {
            local pr_number="$1"
            local comment body
            comment=$(trusted_approval_comment "$pr_number")
            if [[ -z "$comment" || "$comment" == "null" ]]; then
              echo ""
              return
            fi
            body=$(jq -r '.body // empty' <<<"$comment")
            if [[ -z "$body" ]]; then
              echo ""
              return
            fi
            printf '%s\n' "$body" | sed -n 's/.*<!-- ok-to-test-sha: *\([a-f0-9]\{40\}\) event: *\([0-9][0-9]*\) *-->.*/\1 \2/p' | tail -n1
          }

          store_approval() {
            local pr_number="$1"
            local head_sha="$2"
            local event_id="$3"
            local body comment comment_id
            body="ok-to-test approved for \`${head_sha}\` (label event ${event_id}). Re-add the label after new pushes.

          ${APPROVAL_MARKER} ${head_sha} event: ${event_id} -->"
            comment=$(trusted_approval_comment "$pr_number")
            comment_id=$(jq -r '.id // empty' <<<"${comment:-null}")
            if [[ -n "$comment_id" && "$comment_id" != "null" ]]; then
              gh api -X PATCH "repos/${REPO}/issues/comments/${comment_id}" -f body="$body" >/dev/null
            else
              gh api -X POST "repos/${REPO}/issues/${pr_number}/comments" -f body="$body" >/dev/null
            fi
            echo "Stored ok-to-test approval for ${head_sha} (event ${event_id})."
          }

          # Latest ok-to-test labeling from GitHub (trusted); never from the gate artifact.
          latest_label_event() {
            local pr_number="$1"
            gh api --paginate "repos/${REPO}/issues/${pr_number}/events" \
              --jq "[.[] | select(.event == \"labeled\" and .label.name == \"${REQUIRED_LABEL_NAME}\")]" \
              | jq 'last // empty'
          }

          ok_to_test_covers_head() {
            local pr_number="$1"
            local head_sha="$2"

            local label_event event_id labeler stored stored_sha stored_event_id
            label_event=$(latest_label_event "$pr_number")
            if [[ -z "$label_event" || "$label_event" == "null" ]]; then
              echo "No '${REQUIRED_LABEL_NAME}' labeled event for PR #${pr_number}."
              return 1
            fi
            event_id=$(jq -r '.id // empty' <<<"$label_event")
            labeler=$(jq -r '.actor.login // empty' <<<"$label_event")
            if [[ -z "$event_id" || -z "$labeler" ]]; then
              echo "Incomplete '${REQUIRED_LABEL_NAME}' labeled event for PR #${pr_number}."
              return 1
            fi

            stored=$(get_approval "$pr_number")
            stored_sha=$(awk '{print $1}' <<<"$stored")
            stored_event_id=$(awk '{print $2}' <<<"$stored")

            if [[ -n "$stored_event_id" && "$stored_event_id" == "$event_id" ]]; then
              if [[ "$stored_sha" == "$head_sha" ]]; then
                echo "Trusted approval matches head ${head_sha} (event ${event_id})."
                return 0
              fi
              echo "Approval event ${event_id} is for ${stored_sha}, not head ${head_sha}; re-add the label."
              return 1
            fi

            # New maintainer labeling (API event id changed) → record this PR head SHA.
            if ! has_write_access "$labeler"; then
              echo "Labeler ${labeler} lacks write access; not creating approval."
              return 1
            fi
            store_approval "$pr_number" "$head_sha" "$event_id"
            return 0
          }

          # Gate artifact is a lookup hint only (e.g. pr_number). Never trust its
          # event_action / label_name to create or refresh approval.
          PR_NUMBER_HINT=$(jq -r '.pr_number // empty' "$GATE_METADATA_PATH")

          if [[ "$TRIGGER_EVENT" == "merge_group" ]]; then
            {
              echo "pr_number="
              echo "actor="
              echo "event_action="
              echo "head_repository=${HEAD_REPO:-$REPO}"
              echo "head_sha=${HEAD_SHA}"
              echo "head_branch=${HEAD_BRANCH}"
            } >> "$GITHUB_OUTPUT"
            echo "Triggered by merge_group — skipping external authorization."
            exit 0
          fi

          # Resolve PR from GitHub for this run's head SHA. Metadata pr_number is a hint only.
          MATCHED=$(gh api "repos/${REPO}/commits/${HEAD_SHA}/pulls" \
            --jq "[.[] | select(.state == \"open\" and .base.repo.full_name == \"${REPO}\" and .head.sha == \"${HEAD_SHA}\")]")
          MATCH_COUNT=$(jq 'length' <<<"$MATCHED")

          if [[ "$MATCH_COUNT" -eq 0 ]]; then
            echo "### ❌ Cannot run E2E tests — no open PR matches head ${HEAD_SHA}" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [[ "$MATCH_COUNT" -ne 1 ]]; then
            echo "### ❌ Cannot run E2E tests — ambiguous PRs for head ${HEAD_SHA}: $(jq -r '.[].number' <<<"$MATCHED" | tr '\n' ' ')" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          PR_NUMBER=$(jq -r '.[0].number' <<<"$MATCHED")
          if [[ -n "$PR_NUMBER_HINT" && "$PR_NUMBER_HINT" != "$PR_NUMBER" ]]; then
            echo "### ❌ Cannot run E2E tests — gate hint PR #${PR_NUMBER_HINT} does not match verified PR #${PR_NUMBER}" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          ACTOR=$(jq -r '.[0].user.login' <<<"$MATCHED")
          RESOLVED_HEAD_REPO=$(jq -r '.[0].head.repo.full_name' <<<"$MATCHED")
          PR_LABELS=$(jq -r '.[0].labels[].name' <<<"$MATCHED")

          {
            echo "pr_number=${PR_NUMBER}"
            echo "actor=${ACTOR}"
            echo "event_action="
            echo "head_repository=${RESOLVED_HEAD_REPO}"
            echo "head_sha=${HEAD_SHA}"
            echo "head_branch=${HEAD_BRANCH}"
          } >> "$GITHUB_OUTPUT"

          WHITELISTED_BOTS=("red-hat-konflux[bot]" "konflux-ci-coder[bot]" "fullsend-ai-coder[bot]")

          for BOT in "${WHITELISTED_BOTS[@]}"; do
            if [[ "$ACTOR" == "$BOT" ]]; then
              echo "PR author is $BOT, skipping further checks."
              exit 0
            fi
          done

          if [[ "$PR_LABELS" == *$REQUIRED_LABEL_NAME* ]]; then
            if ok_to_test_covers_head "$PR_NUMBER" "$HEAD_SHA"; then
              echo "PR has '${REQUIRED_LABEL_NAME}' approved for head ${HEAD_SHA}. Running E2E tests."
              exit 0
            fi
            echo "PR has '${REQUIRED_LABEL_NAME}', but approval does not match head ${HEAD_SHA}."
          fi

          if has_write_access "$ACTOR"; then
            echo "PR author ${ACTOR} has write (or higher) access. Running E2E tests."
            exit 0
          fi
          echo "PR author ${ACTOR} lacks write access without a matching ok-to-test approval."

          ERROR_SUMMARY=$(cat <<EOF

          ### ❌ Cannot run E2E tests - at least one of the following conditions must be met:
          * PR author is a whitelisted bot (${WHITELISTED_BOTS[*]})
          * PR has label '$REQUIRED_LABEL_NAME' approved for the current head commit (re-add after new pushes)
          * PR author has write (or higher) access on this repository
          EOF
          )
          echo "$ERROR_SUMMARY" >> "$GITHUB_STEP_SUMMARY"
          echo "$ERROR_SUMMARY"
          exit 1

  # Secretless: build candidate UI from PR/merge head. Never receives repository secrets.
  build-candidate:
    needs: authorize
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TARGET_BRANCH: main
      SOURCE_BRANCH: ${{ needs.authorize.outputs.head_branch }}
      PR_NUMBER: ${{ needs.authorize.outputs.pr_number }}
      HEAD_SHA: ${{ needs.authorize.outputs.head_sha }}
      FORKED_REPO_URL: https://github.com/${{ needs.authorize.outputs.head_repository }}.git
      BASE_REPO_URL: https://github.com/${{ github.repository }}.git
      JOB_TYPE: 'on-pr'
      SKIP_KIND_LOAD: 'true'
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.authorize.outputs.head_repository }}
          ref: ${{ needs.authorize.outputs.head_sha }}

      - name: Enable Corepack 📦
        run: corepack enable

      - name: Force Docker to /mnt
        run: |
          sudo systemctl stop docker.socket
          sudo systemctl stop docker
          sudo mkdir -p /mnt/docker
          sudo mkdir -p /etc/systemd/system/docker.service.d
          printf '[Service]\nExecStart=\nExecStart=/usr/bin/dockerd --data-root=/mnt/docker -H fd://' | sudo tee /etc/systemd/system/docker.service.d/override.conf
          sudo systemctl daemon-reload
          sudo systemctl start docker

      - name: Redirect Podman Storage to /mnt
        run: |
          sudo mkdir -p /mnt/podman_storage
          sudo chown -R runner:docker /mnt/podman_storage
          mkdir -p ~/.config/containers
          cat <<EOF > ~/.config/containers/storage.conf
          [storage]
          driver = "overlay"
          graphroot = "/mnt/podman_storage"
          EOF
          podman info --format '{{.Store.GraphRoot}}'

      - name: Build candidate UI image
        run: ./pr_check.sh build

      - name: Upload candidate UI image
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: konflux-ui-image
          path: konflux-ui.tar
          retention-days: 1

      - name: Upload candidate e2e-tests
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: candidate-e2e-tests
          path: e2e-tests
          retention-days: 1

  # Credential-bearing: deploy from trusted default-branch revision only.
  # Checkout never uses the candidate SHA, so PR/merge-group edits to
  # konflux-ui-deploy-test cannot run here (uses: ./.github/actions/... is from base).
  deploy-konflux-ui:
    needs: [authorize, build-candidate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TARGET_BRANCH: main
      SOURCE_BRANCH: ${{ needs.authorize.outputs.head_branch }}
      PR_NUMBER: ${{ needs.authorize.outputs.pr_number }}
      HEAD_SHA: ${{ needs.authorize.outputs.head_sha }}
      FORKED_REPO_URL: https://github.com/${{ needs.authorize.outputs.head_repository }}.git
      BASE_REPO_URL: https://github.com/${{ github.repository }}.git
      COMMIT_INFO_SHA: ${{ needs.authorize.outputs.head_sha }}
      COMMIT_INFO_BRANCH: ${{ needs.authorize.outputs.head_branch }}
      COMMIT_INFO_AUTHOR: ${{ needs.authorize.outputs.actor }}
      CYPRESS_GH_TOKEN: ${{ secrets.HAC_TEST_GH_TOKEN }}
      GH_APP_ID: ${{ secrets.GH_APP_ID }}
      GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
      GH_APP_WEBHOOK_SECRET: ${{ secrets.GH_APP_WEBHOOK_SECRET }}
      QUAY_TEST_ORG: ${{ secrets.QUAY_TEST_ORG }}
      QUAY_TOKEN_TEST: ${{ secrets.QUAY_TOKEN_TEST }}
      SMEE_URL: ${{ secrets.SMEE_URL }}
      CYPRESS_USERNAME: ${{ secrets.CYPRESS_USERNAME }}
      CYPRESS_PASSWORD: ${{ secrets.CYPRESS_PASSWORD }}
      CYPRESS_KONFLUX_BASE_URL: 'https://localhost:9443'
      CYPRESS_PROJECT_ID: ${{ secrets.PROJECT_ID }}
      CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      JOB_TYPE: 'on-pr'
    steps:
      - name: Checkout trusted base revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}

      - name: Download candidate UI image (isolated)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: konflux-ui-image
          path: ${{ runner.temp }}/candidate-artifacts

      - name: Download candidate e2e-tests (isolated)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: candidate-e2e-tests
          path: ${{ runner.temp }}/candidate-artifacts

      - name: Validate and stage allowlisted candidate artifacts
        id: stage-artifacts
        env:
          CANDIDATE_ROOT: ${{ runner.temp }}/candidate-artifacts
          STAGED_E2E: ${{ runner.temp }}/staged-e2e-tests
          WORKSPACE: ${{ github.workspace }}
        run: |
          set -euo pipefail

          # Keep all candidate material outside the trusted checkout. Only allowlisted
          # e2e paths are staged (still under RUNNER_TEMP) for the Cypress mount.
          case "${CANDIDATE_ROOT}" in
            "${WORKSPACE}"|"${WORKSPACE}"/*)
              echo "::error::Candidate artifact root must not be inside the trusted checkout"
              exit 1
              ;;
          esac
          case "${STAGED_E2E}" in
            "${WORKSPACE}"|"${WORKSPACE}"/*)
              echo "::error::Staged e2e directory must not be inside the trusted checkout"
              exit 1
              ;;
          esac

          IMAGE_SRC="${CANDIDATE_ROOT}/konflux-ui.tar"
          E2E_SRC="${CANDIDATE_ROOT}/e2e-tests"
          if [[ ! -d "$E2E_SRC" && -d "${CANDIDATE_ROOT}/tests" ]]; then
            # Artifact may flatten e2e-tests contents at the download root.
            E2E_SRC="${CANDIDATE_ROOT}"
          fi

          if [[ ! -f "$IMAGE_SRC" ]] || [[ -L "$IMAGE_SRC" ]]; then
            echo "::error::Expected a regular file at ${IMAGE_SRC}"
            find "$CANDIDATE_ROOT" -maxdepth 3 -print || true
            exit 1
          fi
          if [[ "$(basename "$IMAGE_SRC")" != "konflux-ui.tar" ]]; then
            echo "::error::UI image artifact name is not allowlisted"
            exit 1
          fi

          if [[ ! -d "$E2E_SRC" ]]; then
            echo "::error::Expected candidate e2e-tests directory under ${CANDIDATE_ROOT}"
            find "$CANDIDATE_ROOT" -maxdepth 3 -print || true
            exit 1
          fi

          rm -rf "$STAGED_E2E"
          mkdir -p "$STAGED_E2E"

          # Allowlist only Cypress test material. Reject path traversal, symlinks that
          # escape the artifact root, and host-executable scripts.
          while IFS= read -r -d '' rel; do
            rel="${rel#./}"
            [[ -n "$rel" ]] || continue
            case "$rel" in
              *..*)
                echo "::error::Refusing path with '..': ${rel}"
                exit 1
                ;;
            esac
            case "$rel" in
              tests|tests/*|support|support/*|utils|utils/*|fixtures|fixtures/*|cypress.config.*|tsconfig*.json|package.json|package-lock.json|yarn.lock|.yarnrc.yml|.yarn|.yarn/*|.cypress*|*.d.ts) ;;
              *)
                echo "Skipping non-allowlisted path: ${rel}"
                continue
                ;;
            esac
            case "$rel" in
              *.sh|*.bash|*.command|entrypoint.sh|delete-script.sh|Containerfile)
                echo "::error::Refusing host-executable or build path from candidate artifact: ${rel}"
                exit 1
                ;;
            esac
            src="${E2E_SRC}/${rel}"
            # Ensure resolved path stays under E2E_SRC (no symlink/absolute escape).
            src_real=$(readlink -f "$src")
            case "$src_real" in
              "${E2E_SRC}"|"${E2E_SRC}"/*) ;;
              *)
                echo "::error::Path escapes candidate e2e root: ${rel} -> ${src_real}"
                exit 1
                ;;
            esac
            dest="${STAGED_E2E}/${rel}"
            mkdir -p "$(dirname "$dest")"
            if [[ -d "$src" && ! -L "$src" ]]; then
              mkdir -p "$dest"
            else
              cp -a "$src" "$dest"
            fi
          done < <(cd "$E2E_SRC" && find . -print0)

          if [[ ! -d "${STAGED_E2E}/tests" ]]; then
            echo "::error::Allowlisted e2e staging is missing tests/"
            exit 1
          fi

          {
            echo "CANDIDATE_UI_TAR=${IMAGE_SRC}"
            echo "E2E_TESTS_DIR=${STAGED_E2E}"
          } >> "$GITHUB_ENV"

      - name: Set commit message
        env:
          GITHUB_TOKEN: ${{ secrets.HAC_TEST_GH_TOKEN }}
          PR_NUMBER: ${{ needs.authorize.outputs.pr_number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ -n "${PR_NUMBER}" ]]; then
            TITLE=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json title --jq '.title')
            echo "COMMIT_INFO_MESSAGE=${TITLE}" >> "$GITHUB_ENV"
          else
            echo "COMMIT_INFO_MESSAGE=merge_group" >> "$GITHUB_ENV"
          fi

      - name: Enable Corepack 📦
        run: corepack enable

      - name: Disc space stats
        run: |
          set -x
          df -h --total
          free -m

      - name: Redirect Cypress Cache to /mnt
        run: |
          sudo mkdir -p /mnt/cypress_cache
          sudo chown -R runner:docker /mnt/cypress_cache
          mkdir -p ~/.cache
          ln -s /mnt/cypress_cache ~/.cache/Cypress

      - name: Force Docker to /mnt
        run: |
          sudo systemctl stop docker.socket
          sudo systemctl stop docker
          sudo mkdir -p /mnt/docker
          sudo mkdir -p /etc/systemd/system/docker.service.d
          printf '[Service]\nExecStart=\nExecStart=/usr/bin/dockerd --data-root=/mnt/docker -H fd://' | sudo tee /etc/systemd/system/docker.service.d/override.conf
          sudo systemctl daemon-reload
          sudo systemctl start docker

      - name: Move npm/yarn cache to /mnt
        run: |
          sudo mkdir -p /mnt/npm_cache
          sudo chown -R runner:docker /mnt/npm_cache
          sudo npm config set cache /mnt/npm_cache --global
          sudo mkdir -p /mnt/yarn_cache
          sudo chown -R runner:docker /mnt/yarn_cache
          export YARN_CACHE_FOLDER=/mnt/yarn_cache

      - name: Redirect Podman Storage to /mnt
        run: |
          sudo mkdir -p /mnt/podman_storage
          sudo chown -R runner:docker /mnt/podman_storage
          mkdir -p ~/.config/containers
          cat <<EOF > ~/.config/containers/storage.conf
          [storage]
          driver = "overlay"
          graphroot = "/mnt/podman_storage"
          EOF
          podman info --format '{{.Store.GraphRoot}}'

      - name: Deploy konflux-ci
        id: pr-check-action
        uses: ./.github/actions/konflux-ui-deploy-test
        with:
          job-type: ${{ env.JOB_TYPE }}
          skip-ui-build: 'true'

      - name: Disc space stats after deploy
        run: |
          set -x
          df -h --total
          free -m
          kubectl describe nodes

      - name: Konflux-ui e2e test
        uses: ./.github/actions/konflux-ui-e2e-test

      - name: Disc space stats after e2e test
        if: ${{ always() }}
        run: |
          set -x
          df -h --total
          free -m
          kubectl describe nodes
          du -h / --max-depth=2 2>/dev/null | sort -hr | head -n 10

      - name: Upload e2e coverage to Codecov
        if: ${{ always() && env.CODECOV_TOKEN != '' }}
        run: ./pr_check.sh upload-coverage

      - name: Generate error logs
        if: ${{ always() }}
        uses: ./.github/actions/generate-error-logs
