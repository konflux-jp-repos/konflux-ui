name: PR Title Check Comment

# Phase 2: posts failure comments after PR Title Check fails (trusted token; works for forks).
# Requires this file on main (workflow_run only uses workflows on the default branch).
on:
  workflow_run:
    workflows: ['PR Title Check']
    types: [completed]

jobs:
  comment:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pull-requests: write
      issues: write
    steps:
      - name: Resolve PR and post title-check comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const pattern = /^(feat|fix|chore|refactor|docs|test|ci|build|perf|style|revert)\(([A-Z]+-\d+|#\d+)\): .+$/;
            const run = context.payload.workflow_run;

            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: run.head_sha,
            });
            const openPr = prs.find((pr) => pr.state === 'open');
            if (!openPr?.number) {
              core.info('No open PR found for workflow run; skipping comment.');
              return;
            }

            const title = openPr.title;
            if (pattern.test(title)) {
              core.info(`PR title is now valid: "${title}"; skipping comment.`);
              return;
            }

            const body = [
              `### PR Title Check Failed`,
              ``,
              `The PR title does not follow the required format:`,
              ``,
              '```',
              `<type>(<ticket-id>): <summary>`,
              '```',
              ``,
              `**Allowed types:** \`feat\`, \`fix\`, \`chore\`, \`refactor\`, \`docs\`, \`test\`, \`ci\`, \`build\`, \`perf\`, \`style\`, \`revert\``,
              ``,
              `**Ticket ID:** Jira ticket (e.g., \`KFLUXUI-123\`, \`KONFLUX-456\`) or GitHub issue (e.g., \`#123\`)`,
              ``,
              `**Examples:**`,
              `- \`feat(KFLUXUI-1200): add syntax highlighting for JSON log lines\``,
              `- \`fix(KONFLUX-456): resolve alignment issue in table header\``,
              `- \`chore(#42): update CI pipeline configuration\``,
              ``,
              `Please update the PR title and the check will re-run automatically.`,
              ``,
              `<!-- pr-title-check -->`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: openPr.number,
              per_page: 100,
            });
            const existing = comments.find(
              (c) =>
                c.user?.login === 'github-actions[bot]' &&
                c.body?.includes('<!-- pr-title-check -->'),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: openPr.number,
                body,
              });
            }
