name: PR Title Check

# Phase 1 of two-phase title validation: runs on pull_request with no secrets.
# Failure comments for fork PRs are posted by pr-title-check-comment.yaml (workflow_run).
on:
  pull_request:
    types: [opened, edited, reopened]

jobs:
  check-pr-title:
    if: >-
      github.actor != 'red-hat-konflux[bot]' &&
      (github.event.action == 'opened' ||
      github.event.action == 'reopened' ||
      (github.event.action == 'edited' && github.event.changes.title))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Validate PR title
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const title = context.payload.pull_request.title;

            // Pattern: type(TICKET-ID): summary
            // type: feat, fix, chore, refactor, docs, test, ci, build, perf, style, revert
            // TICKET-ID: JIRA (KFLUXUI-123, KONFLUX-456) or GitHub issue (#123)
            const pattern = /^(feat|fix|chore|refactor|docs|test|ci|build|perf|style|revert)\(([A-Z]+-\d+|#\d+)\): .+$/;

            if (pattern.test(title)) {
              console.log(`PR title is valid: "${title}"`);
              return;
            }

            core.setFailed(`PR title "${title}" does not match the required format.`);
