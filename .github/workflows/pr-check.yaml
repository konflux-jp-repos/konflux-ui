name: PR Check Gate

# Phase 1 of two-phase PR E2E: secretless signal that a PR/merge_group run is ready.
# Privileged deploy/e2e runs in pr-check-e2e.yaml (workflow_run) from the default branch.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches:
      - main
  merge_group:
    types: [checks_requested]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Record gate metadata
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          LABEL_NAME: ${{ github.event.label.name || '' }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref || github.event.merge_group.head_ref || github.ref_name }}
          ACTOR: ${{ github.event.pull_request.user.login || github.actor }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
        run: |
          set -euo pipefail
          mkdir -p gate-metadata
          jq -n \
            --arg event_name "$EVENT_NAME" \
            --arg event_action "$EVENT_ACTION" \
            --arg label_name "$LABEL_NAME" \
            --arg pr_number "$PR_NUMBER" \
            --arg head_sha "$HEAD_SHA" \
            --arg head_ref "$HEAD_REF" \
            --arg actor "$ACTOR" \
            --arg head_repository "$HEAD_REPO" \
            '{
              event_name: $event_name,
              event_action: $event_action,
              label_name: $label_name,
              pr_number: $pr_number,
              head_sha: $head_sha,
              head_ref: $head_ref,
              actor: $actor,
              head_repository: $head_repository
            }' > gate-metadata/metadata.json
          {
            echo "### PR Check Gate"
            echo ""
            echo "- event: \`${EVENT_NAME}\` / \`${EVENT_ACTION}\`"
            echo "- label: \`${LABEL_NAME}\`"
            echo "- pr: \`${PR_NUMBER}\`"
            echo "- head_sha: \`${HEAD_SHA}\`"
            echo "- actor: \`${ACTOR}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          cat gate-metadata/metadata.json

      - name: Upload gate metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pr-check-gate-metadata
          path: gate-metadata/metadata.json
          retention-days: 1
